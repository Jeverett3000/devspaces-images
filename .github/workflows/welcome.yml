name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome new contributors
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const pr = context.payload.pull_request;

            if (issue) {
              // Welcome message for new issue
              const issueComment = `👋 Thanks for opening your first issue in the devspaces-images repository!

              Please make sure you've provided all the necessary information and context.
              A maintainer will review your issue soon.

              For more information about Red Hat OpenShift Dev Spaces, see the [README](../README.md).`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: issueComment
              });
            }

            if (pr) {
              // Welcome message for new PR
              const prComment = `👋 Thanks for opening your first pull request in the devspaces-images repository!

              Please ensure:
              - Your changes are focused and minimal
              - You've tested your changes locally
              - All CI checks pass

              A maintainer will review your contribution soon. Thank you for contributing to Red Hat OpenShift Dev Spaces!`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: prComment
              });
            }
